version = 3.9.10
runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

# Keep the hand-formatted shape: existing line breaks, trailing commas and docstrings stay.
newlines.source = keep
trailingCommas = keep
docstrings.style = keep
docstrings.wrap = no
docstrings.forceBlankLineBefore = false
align.preset = none
danglingParentheses.preset = true

# Scala 3: new syntax (`if ... then`, `x: T` givens) but no brace/`end` rewriting.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = no
rewrite.scala3.insertEndMarkerMinLines = 0

project.git = true
# The capture-checked library uses syntax (`T ->{any.rd} B`, `FileEntry^{this}`)
# that scalafmt's parser rejects; it is hand-formatted (and bundled into the system prompt).
project.excludePaths = ["glob:**/lib/src/atc/lib/Interface.scala"]
