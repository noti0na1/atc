name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          mill_version: 1.1.8
        - os: macos-latest
          mill_version: 1.1.8
        - os: windows-latest
          mill_version: 1.1.8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MILL_VERSION: ${{ matrix.mill_version }}

    steps:
    - uses: actions/checkout@v7
    - name: Test the Unix wrapper script
      if: runner.os != 'Windows'
      shell: bash
      run: bash tests/atc_test.sh
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Mill and Coursier
      uses: coursier/cache-action@v8
    - name: Check formatting
      if: runner.os == 'Linux'
      shell: bash
      run: ./mill __.checkFormat
    - name: Build distribution
      if: runner.os != 'Windows'
      shell: bash
      run: ./mill dist
    - name: Build distribution (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./mill.bat dist
    - name: Run tests
      if: ${{ !cancelled() && runner.os != 'Windows' }}
      shell: bash
      run: ./mill app.test
    - name: Run tests (Windows, serial)
      if: ${{ !cancelled() && runner.os == 'Windows' }}
      shell: pwsh
      run: ./mill.bat app.test

  # Publishing a GitHub release (tag vX.Y.Z) builds the distribution and
  # attaches both jars and the Windows launchers; the Unix `atc` wrapper downloads
  # the two jars and checks them against the digests GitHub records.
  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Check that the release tag matches Versions.atc in build.mill
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(sed -nE 's/^ *val atc = "([^"]+)".*/\1/p' build.mill)
        echo "tag: $TAG, Versions.atc: $version"
        if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
          echo "::error::release tag '$TAG' does not match Versions.atc = \"$version\" in build.mill (atc --version would disagree with the tag); bump the version, move the tag and publish again"
          exit 1
        fi
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Mill and Coursier
      uses: coursier/cache-action@v8
    - name: Build distribution
      run: ./mill dist
    - name: Upload the jars to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        gh release upload "$TAG" out/dist.dest/atc.jar out/dist.dest/atc-lib.jar out/dist.dest/atc.cmd out/dist.dest/atc.ps1 --clobber
        gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'
