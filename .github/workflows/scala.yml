name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  # Unit tests, the wrapper tests, the jars, and a run test of the jars against
  # the mock LLM server. The jars are uploaded once (from Linux) as the artifact
  # the native builds and the release job consume.
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          mill_version: 1.1.8
        - os: macos-latest
          mill_version: 1.1.8
        - os: windows-latest
          mill_version: 1.1.8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MILL_VERSION: ${{ matrix.mill_version }}

    steps:
    - uses: actions/checkout@v7
    - name: Test the Unix wrapper scripts
      if: runner.os != 'Windows'
      shell: bash
      run: bash tests/atc_test.sh && bash tests/atcn_test.sh
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Mill and Coursier
      uses: coursier/cache-action@v8
    - name: Check formatting
      if: runner.os == 'Linux'
      shell: bash
      run: ./mill __.checkFormat
    - name: Build distribution
      if: runner.os != 'Windows'
      shell: bash
      run: ./mill dist
    - name: Build distribution (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./mill.bat dist
    - name: Run tests
      if: ${{ !cancelled() && runner.os != 'Windows' }}
      shell: bash
      run: ./mill app.test
    - name: Run tests (Windows, serial)
      if: ${{ !cancelled() && runner.os == 'Windows' }}
      shell: pwsh
      run: ./mill.bat app.test
    - name: Run test against the mock LLM server (jars)
      if: ${{ !cancelled() && runner.os != 'Windows' }}
      shell: bash
      run: bash tests/run_test.sh jar
    - name: Upload the jars
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: atc-jars
        path: |
          out/dist.dest/atc.jar
          out/dist.dest/atc-lib.jar
          out/dist.dest/atc.cmd
          out/dist.dest/atc.ps1
          out/dist.dest/version.txt
        if-no-files-found: error
        retention-days: 14

  # The native image (native/README.md), one binary per platform, from the jars
  # the build job produced. Each is run-tested against the mock LLM server and
  # uploaded as atc-native-<os>-<arch>.tar.gz (Windows: .zip). Needs GraalVM 25.3+,
  # which the community edition publishes for linux-x64, linux-arm64, macos-arm64
  # and windows-x64 only (no macOS Intel, no Windows arm64), and 12 to 13 GB of
  # builder heap on a 16 GB runner (the build then spends much of its time in
  # GC; expect 20 minutes); the standard macOS Apple Silicon runner has 7 GB, so
  # that target and the untested Windows one are continue-on-error until they
  # get a larger or self-hosted runner (set the target's `runner`).
  native:
    name: Native image (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        # xmx: builder heap on a 16 GB runner (7 GB on macOS arm64); threads: builder
        # threads, fewer need less heap in the compile phase (arm64 code is larger).
        - target: linux-x64
          runner: ubuntu-latest
          xmx: 13g
          threads: 4
        - target: linux-arm64
          runner: ubuntu-24.04-arm
          xmx: 13g
          threads: 2
        - target: macos-arm64
          runner: macos-latest
          xmx: 5g
          threads: 2
          experimental: true
        - target: windows-x64
          runner: windows-latest
          xmx: 13g
          threads: 3
          experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
    - name: Download the jars
      uses: actions/download-artifact@v4
      with:
        name: atc-jars
        path: out/dist.dest
    - name: Set up GraalVM 25.3 (JDK 25)
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: 'graalvm-community'
        version: '25.3'
        java-version: '25'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        native-image-job-reports: 'true'
    - name: Build the native image
      shell: bash
      env:
        ATC_NATIVE_XMX: ${{ matrix.xmx }}
        ATC_NATIVE_THREADS: ${{ matrix.threads }}
      run: GRAALVM_HOME="$JAVA_HOME" native/build.sh
    - name: Run test against the mock LLM server (native)
      if: runner.os != 'Windows'
      shell: bash
      env:
        ATC_JAVA_HOME: ${{ env.JAVA_HOME }}
      run: bash tests/run_test.sh native
    - name: Package
      shell: bash
      run: |
        cd out/native
        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a -tzip "atc-native-${{ matrix.target }}.zip" atc.exe *.dll
        else
          tar -czf "atc-native-${{ matrix.target }}.tar.gz" atc
        fi
        ls -la atc-native-*
    - name: Upload the binary
      uses: actions/upload-artifact@v4
      with:
        name: atc-native-${{ matrix.target }}
        path: out/native/atc-native-${{ matrix.target }}.*
        if-no-files-found: error
        retention-days: 14

  # Publishing a GitHub release (tag vX.Y.Z) attaches what the jobs above built:
  # the two jars and the Windows launchers (the `atc` wrapper downloads the jars
  # and checks them against the digests GitHub records) and every native binary
  # that was built (the `atcn` wrapper downloads its platform's archive).
  publish-release:
    if: github.event_name == 'release'
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Check that the release tag matches Versions.atc in build.mill
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(sed -nE 's/^ *val atc = "([^"]+)".*/\1/p' build.mill)
        echo "tag: $TAG, Versions.atc: $version"
        if [ "$TAG" != "v$version" ] && [ "$TAG" != "$version" ]; then
          echo "::error::release tag '$TAG' does not match Versions.atc = \"$version\" in build.mill (atc --version would disagree with the tag); bump the version, move the tag and publish again"
          exit 1
        fi
    - name: Download the jars
      uses: actions/download-artifact@v4
      with:
        name: atc-jars
        path: release/jars
    - name: Download the native binaries
      uses: actions/download-artifact@v4
      with:
        pattern: atc-native-*
        path: release/native
        merge-multiple: true
    - name: Upload the assets to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        ls -la release/jars release/native
        gh release upload "$TAG" release/jars/atc.jar release/jars/atc-lib.jar release/jars/atc.cmd release/jars/atc.ps1 --clobber
        if ls release/native/atc-native-* >/dev/null 2>&1; then
          gh release upload "$TAG" release/native/atc-native-* --clobber
        fi
        gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'
